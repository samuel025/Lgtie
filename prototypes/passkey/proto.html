<!doctype html>
<meta charset="utf-8"><title>LGtie passkey prototype</title>
<p>Gate 1 prototype: create a passkey, then sign a 32-byte challenge. Used only by <code>gen-vector.mjs</code>.</p>
<script>
// Everything here is the browser's own WebAuthn API. Nothing leaves the page.
const b64u = b => btoa(String.fromCharCode(...new Uint8Array(b))).replace(/\+/g, "-").replace(/\//g, "_").replace(/=+$/, "");
const unb64u = s => Uint8Array.from(atob(s.replace(/-/g, "+").replace(/_/g, "/")), c => c.charCodeAt(0));
const hex = b => [...new Uint8Array(b)].map(x => x.toString(16).padStart(2, "0")).join("");
// An ECDSA signature from WebAuthn is DER encoded: 30 len 02 rlen r 02 slen s. Return fixed 32-byte r and s.
function derToRS(der) {
  const d = new Uint8Array(der); let i = 2; if (d[1] & 0x80) i += d[1] & 0x7f;
  const rl = d[i + 1], r = d.slice(i + 2, i + 2 + rl); i += 2 + rl;
  const sl = d[i + 1], s = d.slice(i + 2, i + 2 + sl);
  const fix = v => { v = [...v]; while (v.length > 32 && v[0] === 0) v.shift(); while (v.length < 32) v.unshift(0); return new Uint8Array(v); };
  return {r: fix(r), s: fix(s)};
}
window.pk = {
  async enroll(userName) {
    const cred = await navigator.credentials.create({publicKey: {
      rp: {name: "LGtie prototype"}, user: {id: crypto.getRandomValues(new Uint8Array(16)), name: userName, displayName: userName},
      challenge: crypto.getRandomValues(new Uint8Array(32)), pubKeyCredParams: [{type: "public-key", alg: -7}],
      authenticatorSelection: {residentKey: "required", userVerification: "required"}, attestation: "none"}});
    const spki = new Uint8Array(cred.response.getPublicKey()), xy = spki.slice(spki.length - 64);   // SPKI ends with 04 || x || y
    return {credentialId: b64u(cred.rawId), x: hex(xy.slice(0, 32)), y: hex(xy.slice(32)), rpId: location.hostname};
  },
  async sign(challengeHex, credentialId) {
    const ch = Uint8Array.from(challengeHex.match(/../g).map(h => parseInt(h, 16)));
    const a = await navigator.credentials.get({publicKey: {challenge: ch, rpId: location.hostname, userVerification: "required",
      allowCredentials: credentialId ? [{type: "public-key", id: unb64u(credentialId)}] : []}});
    const {r, s} = derToRS(a.response.signature);
    return {authenticatorData: hex(a.response.authenticatorData), clientDataJSON: new TextDecoder().decode(a.response.clientDataJSON), r: hex(r), s: hex(s), credentialId: b64u(a.rawId)};
  }
};
</script>
