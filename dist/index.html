<script>/* rules.js */
// LGtie rule engine: parse a plain-text policy, run it, compile it to a TapeOut NAND netlist, prove the two agree.
// Works in the browser (window.TB) and in Node (require). No dependencies.
(function (root) {
  "use strict";
  // ---------- policy text format ----------
  // name: Warranty claims
  // about: one line shown to the person answering
  // question: Is it within the warranty period? | Purchase date on the receipt
  // result: Not covered                      (results are numbered in the order written: 0, 1, 2 ...)
  // rule: Q2=no -> Not covered : Explanation shown when this rule decides      (rules are checked top to bottom; first match wins)
  // default: Covered : Explanation shown when no rule matched
  function parse(text) {
    const P = {name: "", about: "", questions: [], results: [], rules: [], def: null}, errors = [];
    const err = (n, m) => errors.push({line: n, message: m});
    String(text || "").split(/\r?\n/).forEach((raw, i) => {
      const n = i + 1, line = raw.trim(); if (!line || line.startsWith("#")) return;
      const m = /^(name|about|question|result|rule|default)\s*:\s*(.*)$/i.exec(line);
      if (!m) { err(n, "Start the line with name:, about:, question:, result:, rule: or default:"); return; }
      const key = m[1].toLowerCase(), val = m[2].trim();
      if (key === "name") P.name = val; else if (key === "about") P.about = val;
      else if (key === "question") { const [q, hint] = val.split("|").map(s => s.trim()); if (!q) err(n, "A question needs some text."); else P.questions.push({id: "Q" + (P.questions.length + 1), text: q, hint: hint || ""}); }
      else if (key === "result") { if (!val) err(n, "A result needs a name."); else P.results.push(val); }
      else if (key === "default") { const [r, why] = val.split(/\s:\s/).map(s => s.trim()); P.def = {resultName: r, why: why || "", line: n}; }
      else { // rule
        const arrow = val.split(/\s*->\s*/); if (arrow.length !== 2) { err(n, "A rule looks like: Q1=no & Q2=yes -> Result name : explanation"); return; }
        const [rname, why] = arrow[1].split(/\s:\s/).map(s => s.trim());
        const conds = arrow[0].split("&").map(s => s.trim()).filter(Boolean).map(c => { const cm = /^Q(\d+)\s*=\s*(yes|no)$/i.exec(c); return cm ? {q: Number(cm[1]) - 1, yes: cm[2].toLowerCase() === "yes", raw: c} : {bad: c}; });
        if (!conds.length) { err(n, "A rule needs at least one condition, such as Q1=no."); return; }
        conds.filter(c => c.bad).forEach(c => err(n, `"${c.bad}" is not a condition. Use Q1=yes or Q1=no.`));
        P.rules.push({conds, resultName: rname, why: why || "", line: n});
      }
    });
    if (!P.name) errors.push({line: 0, message: "Add a name: line."});
    if (!P.questions.length) errors.push({line: 0, message: "Add at least one question: line."});
    if (P.questions.length > 64) errors.push({line: 0, message: "At most 64 questions."});
    if (P.results.length < 2) errors.push({line: 0, message: "Add at least two result: lines."});
    if (P.results.length > 256) errors.push({line: 0, message: "At most 256 results."});
    if (!P.def) errors.push({line: 0, message: "Add a default: line (the result when no rule matches)."});
    const idx = nm => P.results.findIndex(r => r.toLowerCase() === String(nm || "").toLowerCase());
    P.rules.forEach(r => { r.result = idx(r.resultName); if (r.result < 0) err(r.line, `"${r.resultName}" is not one of the result: lines.`); r.conds.forEach(c => { if (!c.bad && (c.q < 0 || c.q >= P.questions.length)) err(r.line, `${c.raw} refers to a question that does not exist.`); }); });
    if (P.def) { P.def.result = idx(P.def.resultName); if (P.def.result < 0) err(P.def.line, `"${P.def.resultName}" is not one of the result: lines.`); }
    return errors.length ? {errors} : {policy: P, errors: []};
  }

  // ---------- run a policy directly (the reference the circuit is checked against) ----------
  // answers: array of booleans, one per question. -> {result, why, ruleIndex} (ruleIndex -1 = default)
  function run(P, answers) {
    for (let i = 0; i < P.rules.length; i++) { const r = P.rules[i]; if (r.conds.every(c => !!answers[c.q] === c.yes)) return {result: r.result, why: r.why, ruleIndex: i}; }
    return {result: P.def.result, why: P.def.why, ruleIndex: -1};
  }
  const resultBits = P => Math.max(1, Math.ceil(Math.log2(P.results.length)));

  // ---------- NAND netlist builder (refs: 0/1 reserved, inputs from 2, gates after; 7 bytes per gate) ----------
  class Net {
    constructor(nIn) { this.nIn = nIn; this.gates = []; this.memo = new Map(); this.inputs = Array.from({length: nIn}, (_, i) => 2 + i); }
    nand(a, b) { const k = a < b ? a + "," + b : b + "," + a; if (this.memo.has(k)) return this.memo.get(k); this.gates.push({a, b}); const r = 2 + this.nIn + this.gates.length - 1; this.memo.set(k, r); return r; }
    not(a) { return this.nand(a, a); }
    and(a, b) { return this.not(this.nand(a, b)); }
    or(a, b) { return this.nand(this.not(a), this.not(b)); }
    finalCopy(x) { this.gates.push({a: x, b: x}); return 2 + this.nIn + this.gates.length - 1; } // an output owns its gate: NOT(x) with x = NOT(wanted)
  }
  const hexOf = gates => "0x" + gates.map(g => "00" + g.a.toString(16).padStart(6, "0") + g.b.toString(16).padStart(6, "0")).join("");
  function evalGates(gates, nIn, nOut, m) { // m = integer, input k = bit k
    const v = {0: 0, 1: 1}; for (let k = 0; k < nIn; k++) v[2 + k] = Math.floor(m / 2 ** k) % 2;
    gates.forEach((g, i) => { v[2 + nIn + i] = 1 - (v[g.a] & v[g.b]); });
    let out = 0; for (let o = 0; o < nOut; o++) out += v[2 + nIn + gates.length - nOut + o] * 2 ** o; return out;
  }

  // ---------- compile: first-match rules -> NAND circuit ----------
  function compile(P) {
    const nQ = P.questions.length, nOut = resultBits(P), n = new Net(nQ);
    const lit = (q, yes) => yes ? n.inputs[q] : n.not(n.inputs[q]);
    const x0 = n.inputs[0]; let zeroSig = null; const zero = () => zeroSig === null ? (zeroSig = n.and(x0, n.not(x0))) : zeroSig, one = () => n.not(zero()); // only built when a bit is constant
    const fires = []; let notYet = null; // notYet = no earlier rule matched
    P.rules.forEach(r => {
      let cond = lit(r.conds[0].q, r.conds[0].yes); for (const c of r.conds.slice(1)) cond = n.and(cond, lit(c.q, c.yes));
      fires.push({res: r.result, sig: notYet === null ? cond : n.and(cond, notYet)});
      notYet = notYet === null ? n.not(cond) : n.and(notYet, n.not(cond));
    });
    fires.push({res: P.def.result, sig: notYet === null ? one() : notYet});
    const bitSig = [];
    for (let b = 0; b < nOut; b++) {
      const terms = fires.filter(f => (f.res >> b) & 1).map(f => f.sig);
      bitSig.push(terms.length ? terms.reduce((acc, t) => n.or(acc, t)) : zero());
    }
    const inv = bitSig.map(s => n.not(s)); // computed before the output gates so they stay last
    inv.forEach(s => n.finalCopy(s));
    const gates = prune(n.gates, nQ, nOut);
    return {gates, hex: hexOf(gates), nIn: nQ, nOut};
  }

  // Drop gates that feed no output (outputs are the last nOut gates) and renumber. Behaviour is unchanged.
  function prune(gates, nIn, nOut) {
    const base = 2 + nIn, live = new Set(), stack = [];
    for (let i = gates.length - nOut; i < gates.length; i++) { live.add(i); stack.push(i); }
    while (stack.length) { const g = gates[stack.pop()]; for (const r of [g.a, g.b]) { const k = r - base; if (k >= 0 && !live.has(k)) { live.add(k); stack.push(k); } } }
    const keep = [...live].sort((a, b) => a - b), idx = new Map(keep.map((k, i) => [k, i])), re = r => { const k = r - base; return k < 0 ? r : base + idx.get(k); };
    return keep.map(k => ({a: re(gates[k].a), b: re(gates[k].b)}));
  }

  // Prove the circuit equals the policy on every answer combination (or a seeded sample when there are many questions).
  function verify(P, C) {
    const nQ = P.questions.length, total = 2 ** Math.min(nQ, 40), exhaustive = nQ <= 14, N = exhaustive ? 2 ** nQ : 4096;
    let seed = 12345; const rnd = () => (seed = (seed * 1103515245 + 12345) & 0x7fffffff) / 0x7fffffff;
    for (let i = 0; i < N; i++) {
      const m = exhaustive ? i : Math.floor(rnd() * 2 ** Math.min(nQ, 48));
      const answers = Array.from({length: nQ}, (_, k) => Math.floor(m / 2 ** k) % 2 === 1);
      const want = run(P, answers).result, got = evalGates(C.gates, nQ, C.nOut, m);
      if (want !== got) return {ok: false, checked: i + 1, exhaustive, m, want, got};
    }
    return {ok: true, checked: N, exhaustive, total};
  }

  const encodeAnswers = answers => answers.reduce((acc, a, k) => acc + (a ? 2 ** k : 0), 0); // question k = bit k (TapeOut input order)
  const decodeAnswers = (m, nQ) => Array.from({length: nQ}, (_, k) => Math.floor(m / 2 ** k) % 2 === 1);

  // Canonical text of a policy (what gets hashed and published as the "definitions document").
  function canonical(P) {
    return [`name: ${P.name}`, P.about ? `about: ${P.about}` : null, ...P.questions.map(q => `question: ${q.text}${q.hint ? " | " + q.hint : ""}`), ...P.results.map(r => `result: ${r}`),
      ...P.rules.map(r => `rule: ${r.conds.map(c => `Q${c.q + 1}=${c.yes ? "yes" : "no"}`).join(" & ")} -> ${r.resultName}${r.why ? " : " + r.why : ""}`), `default: ${P.def.resultName}${P.def.why ? " : " + P.def.why : ""}`].filter(Boolean).join("\n") + "\n";
  }

  // ---------- built-in templates ----------
  const TEMPLATES = {
    warranty: `name: Warranty claims
about: Find out whether a repair would be covered before you file a claim.
question: Is the product registered, or can you show proof of purchase? | Registration number or receipt
question: Is it still within the warranty period? | Purchase date
question: Was it bought from an authorised seller? | Seller name on the receipt
question: Is this type of damage or fault one the warranty covers? | Fault description and photos
question: Is there no excluded cause, such as water damage, a drop or an unauthorised repair? | Repair centre inspection note
question: Is the product within its usage limit? | Usage reading or hours
question: Is the repair you need one the warranty covers? | Repair centre quote
result: Not covered
result: Needs review
result: Partly covered (parts, not labour)
result: Covered
rule: Q1=no -> Not covered : The product is not registered and no proof of purchase was shown.
rule: Q2=no -> Not covered : The warranty period has ended.
rule: Q4=no -> Not covered : This type of damage or fault is not covered by the warranty.
rule: Q5=no -> Not covered : An excluded cause was found (for example water damage, a drop or an unauthorised repair).
rule: Q7=no -> Not covered : This type of repair is not covered by the warranty.
rule: Q3=no -> Needs review : It was not bought from an authorised seller, so a person has to look at it.
rule: Q6=no -> Partly covered (parts, not labour) : The usage limit was exceeded, so parts are covered but labour is not.
default: Covered : Every condition of the warranty is met.
`,
    bounty: `name: Bug bounty severity
about: Agree how serious a reported vulnerability is by answering plain questions instead of arguing about the label.
question: Can an attacker start it without any special role or permission? | Reproduction steps from an unprivileged account
question: Can it cause an unauthorised loss of funds or assets? | Proof of concept or transaction trace
question: Does it affect more than one user or pool? | Proof of concept showing a second victim
question: Does it work without any victim having to sign or click anything? | Demonstration with no victim step
question: Can the attacker repeat it with the same effect? | A second run on the same fork
question: Is the damage permanent, so the project cannot reverse it? | Analysis of recovery options
question: Could a reviewer reproduce it on a fork or testnet? | Reviewer's reproduction log
question: Is the affected asset on the programme's published scope list? | Link to the scope entry
result: Rejected
result: Low
result: Medium
result: High
result: Critical
rule: Q8=no -> Rejected : The affected asset is not in the programme's scope.
rule: Q7=no -> Rejected : The issue could not be reproduced.
rule: Q1=yes & Q2=yes & Q4=yes & Q6=yes -> Critical : Anyone can steal funds permanently without any victim action.
rule: Q2=yes & Q6=yes -> High : Funds can be lost permanently, but the attack needs a special role or a victim action.
rule: Q2=yes -> Medium : Funds can be lost, but the loss can be reversed.
rule: Q6=yes -> Medium : Permanent damage without a loss of funds.
default: Low : It is reproducible and in scope, but there is no loss of funds and no permanent damage.
`
  };

  const API = {parse, run, compile, verify, resultBits, encodeAnswers, decodeAnswers, canonical, hexOf, evalGates, TEMPLATES, Net};
  if (typeof module !== "undefined" && module.exports) module.exports = API; else root.TB = API;
})(typeof window !== "undefined" ? window : globalThis);

</script><script>/* config.js */
// Addresses on X Layer (chain 196). registry / caseContract stay zero until they are deployed; `published` maps a template key
// to the circuit it was published as, e.g. warranty: {circuitId: 13}. With no circuit id the page computes in the browser and says so.
window.TB_CONFIG = {
  chainId: 196, rpc: "https://rpc.xlayer.tech", explorer: "https://www.oklink.com/xlayer",
  processor: "0x9e2849c04a513fe64db07521cbe52d078d905c0e",
  faucet: "0xBC58802002307fD80048e93A6475335eC65a4f39",          // free NAND, once per wallet
  transistors: "0xd0faafc5b9149cae7bd9af64070fee33c46ed619",      // NAND token (ERC-1155 id 0)
  tapeoutFeeWei: "1300000000000000",                              // 0.0013 OKB per tape-out
  registry: "0x25E87D367316038a2d3B6A4fe3d58AA453D4c219",
  caseContract: "0x0d45f65dC5C14cc4f4EE926e52979D3DcBd246B3",    // TiebreakCaseV2: set by scripts/deploy-case-v2.sh
  caseContractV1: "0x14c9C106d0A785091F77Fc36F5b2152a5d8C9987",  // the first, simpler case contract (no deadlines); still on-chain
  published: {warranty: {circuitId: 13, ruleSetId: 1}}
};

</script><script>/* wallet.js */
// Minimal browser-wallet helper (no server): connect, switch to X Layer, send a transaction, wait for the receipt. Reads use the public RPC.
(function () {
  "use strict";
  const CFG = window.TB_CONFIG; let account = null;
  const eth = () => window.ethereum;
  const rpc = async (method, params) => { const r = await (await fetch(CFG.rpc, {method: "POST", headers: {"content-type": "application/json"}, body: JSON.stringify({jsonrpc: "2.0", id: 1, method, params})})).json(); if (r.error) throw new Error(r.error.message || "RPC error"); return r.result; };
  async function connect() {
    if (!eth()) throw new Error("No wallet found. Install a wallet such as OKX Wallet, then reload this page.");
    account = (await eth().request({method: "eth_requestAccounts"}))[0].toLowerCase();
    if (parseInt(await eth().request({method: "eth_chainId"}), 16) !== CFG.chainId) {
      try { await eth().request({method: "wallet_switchEthereumChain", params: [{chainId: "0x" + CFG.chainId.toString(16)}]}); }
      catch (e) { if (e && e.code === 4902) await eth().request({method: "wallet_addEthereumChain", params: [{chainId: "0x" + CFG.chainId.toString(16), chainName: "X Layer", nativeCurrency: {name: "OKB", symbol: "OKB", decimals: 18}, rpcUrls: [CFG.rpc], blockExplorerUrls: [CFG.explorer]}]}); else throw e; }
    }

    if (/^0x0+$/.test(CFG.registry)) return null;
    const x = (await rpc("eth_call", [{to: CFG.registry, data: "0x9507d39a" + w(id)}, "latest"])).replace("0x", ""), W = i => x.slice(i * 64, i * 64 + 64);
    return {publisher: "0x" + W(1).slice(24), processor: "0x" + W(2).slice(24), circuitId: Number(BigInt("0x" + W(3))), nQ: Number(BigInt("0x" + W(4))), nOut: Number(BigInt("0x" + W(5))), hash: "0x" + W(6), previousId: Number(BigInt("0x" + W(7))), publishedAt: Number(BigInt("0x" + W(8)))};
  }
  // ---------- policies ----------
  function loadPolicy(key) {
    if (TB.TEMPLATES[key]) { const r = TB.parse(TB.TEMPLATES[key]); return {key, policy: r.policy, text: TB.TEMPLATES[key]}; }
    if (key.startsWith("c=")) { try { const text = b64d(key.slice(2)), r = TB.parse(text); if (!r.errors.length) return {key, policy: r.policy, text, custom: true}; } catch {} }
    return null;
  }

  // ---------- views ----------
  function home() {
    main.innerHTML = `
    <h1>Know if you are covered before you file.</h1>
    <p class="lede">Businesses publish their policy once, as a checker anyone can use. You answer plain questions, see the result and the reason, and anyone can re-run it and get the same answer.</p>
    <div class="row"><a class="btn" href="#check/warranty">Try the warranty check</a><a class="btn ghost" href="#build">Publish your own policy</a></div>
    <div class="grid">
      <div class="card"><h3>For customers</h3><p>No account and no wallet. Answer yes or no, get a clear result and the exact reason, and share the link.</p></div>
      <div class="card"><h3>For businesses</h3><p>Paste your policy as simple rules. We turn it into a checker you can put on your support page, so there is less arguing about what the rules say.</p></div>
      <div class="card"><h3>For anyone in doubt</h3><p>A "check it yourself" button re-runs the published rules. The rules can't be changed after the fact.</p></div>
    </div>
    <h2>Try another example</h2>
    <div class="grid"><div class="card"><h3>Warranty claims</h3><p class="mute">Is a repair covered?</p><a class="btn small" href="#check/warranty">Open</a></div>
    <div class="card"><h3>Bug bounty severity</h3><p class="mute">How serious is a reported vulnerability?</p><a class="btn small" href="#check/bounty">Open</a></div></div>`;
  }

  // Snippets for putting a checker on another website (static: a script tag that adds an iframe, or a plain iframe).
  function embedBox(key, rsm, P) {
    const dir = location.href.split("#")[0].replace(/[^/]*$/, ""), spec = key + (rsm ? "/rs=" + rsm[1] : ""), script = `<div></div>\n<script src="${dir}embed.js" data-checker="${spec}" async><\/script>`, frame = `<iframe src="${dir}index.html#embed/${spec}" title="${P.name}" style="width:100%;height:640px;border:0"></iframe>`;
    return `<details class="card" id="embedbox"><summary>Put this checker on your own website</summary><p class="small">Paste this where you want the checker to appear. It resizes itself and needs nothing else.</p><pre id="snip1">${esc(script)}</pre><div class="row"><button class="btn small ghost" id="cps1" type="button">Copy</button></div>
      <p class="small">Or use a plain frame:</p><pre id="snip2">${esc(frame)}</pre><div class="row"><button class="btn small ghost" id="cps2" type="button">Copy</button></div></details>`;
  }
  async function check(key, rest, embed) {
    const L = loadPolicy(key); if (!L) { main.innerHTML = `<h1>We could not open that checker</h1><p>The link may be incomplete. <a href="#check/warranty">Open the warranty example</a>.</p>`; return; }
    const P = L.policy, C = TB.compile(P), nQ = P.questions.length, rsm = /(?:^|[/&])rs=(\d+)/.exec(rest || ""), tail = (rsm ? "rs=" + rsm[1] + "&" : ""), pre = "#" + (embed ? "embed" : "check") + "/" + key + "/" + tail, fullPre = "#check/" + key + "/" + tail;
    let published = CFG.published[key], banner = "";
    if (!published && rsm && L.custom) {
      try {
        const rec = await fetchRuleSet(Number(rsm[1])), h = await sha256(TB.canonical(P));
        if (rec && rec.hash === h && rec.processor === CFG.processor.toLowerCase() && rec.nQ === nQ && rec.nOut === C.nOut) { published = {circuitId: rec.circuitId, ruleSetId: Number(rsm[1])}; banner = `<div class="note ok-note">✓ These rules match rule set #${rsm[1]} published on X Layer (circuit #${rec.circuitId}).</div>`; }
        else banner = `<div class="note">These rules do <b>not</b> match rule set #${rsm[1]} on X Layer, so the result below is only a preview. Ask the business for the original link.</div>`;
      } catch { banner = `<div class="note">Could not reach X Layer to confirm that these rules were published, so the result below is only a preview.</div>`; }
    }
    let ans = Array(nQ).fill(null);
    const a = /(?:^|[/&])a=(\d+)/.exec(rest || ""); if (a) { const m = Number(a[1]); ans = TB.decodeAnswers(m, nQ); }
    main.innerHTML = `<h1>${esc(P.name)}</h1><p class="lede">${esc(P.about || "")}</p>${banner}
      <div class="prog"><i id="bar"></i></div><div class="small mute" id="count"></div>
      <div id="qs"></div><div id="resbox"></div>${embed ? `<p class="small mute embedfoot">Checked with <b>LGtie</b> · <a href="${esc(location.href.split("#")[0] + fullPre.replace(/&$/, "").replace(/\/$/, ""))}" target="_blank" rel="noopener">Open the full page</a></p>` : embedBox(key, rsm, P)}`;
    const qs = $("#qs");
    P.questions.forEach((q, i) => {
      const d = document.createElement("div"); d.className = "q"; d.innerHTML = `<div class="t">${i + 1}. ${esc(q.text)}</div>${q.hint ? `<div class="h">Evidence: ${esc(q.hint)}</div>` : ""}<div class="yn" role="group" aria-label="Answer to question ${i + 1}"><button type="button" data-v="1" aria-pressed="false">Yes</button><button type="button" data-v="0" aria-pressed="false">No</button></div>`;
      d.querySelectorAll("button").forEach(b => b.onclick = () => { ans[i] = b.dataset.v === "1"; paint(); });
      qs.appendChild(d);
    });
    let seq = 0;
    const report = () => { if (embed && window.parent !== window) window.parent.postMessage({lgtie: "height", h: Math.ceil(main.getBoundingClientRect().bottom + window.scrollY + 12)}, "*"); };
    if (embed && window.ResizeObserver) new ResizeObserver(report).observe(document.body);
    function paint() {
      qs.querySelectorAll(".q").forEach((d, i) => d.querySelectorAll("button").forEach(b => b.setAttribute("aria-pressed", String(ans[i] !== null && (b.dataset.v === "1") === ans[i]))));
      setTimeout(report, 0);
      const done = ans.filter(x => x !== null).length; $("#bar").style.width = (100 * done / nQ) + "%"; $("#count").textContent = `${done} of ${nQ} answered`;
      const box = $("#resbox");
      if (done < nQ) { box.innerHTML = ""; return; }
      const r = TB.run(P, ans), m = TB.encodeAnswers(ans), link = location.href.split("#")[0] + fullPre + "a=" + m, mine = ++seq;
      const hexIn = inputBytes(m, nQ), rule = r.ruleIndex >= 0 ? "Rule " + (r.ruleIndex + 1) + ": " + P.rules[r.ruleIndex].conds.map(c => `question ${c.q + 1} = ${c.yes ? "yes" : "no"}`).join(" and ") : "No rule matched, so the default applies";
      box.innerHTML = `<div class="res" role="status"><div class="big">${esc(P.results[r.result])}</div><div class="why">${esc(r.why || "")}</div>
        <div class="row"><span class="badge" id="vbadge">Checking…</span><button class="btn small ghost" id="cp" type="button">Copy link to this result</button><button class="btn small ghost" id="rs" type="button">Start over</button></div>
        <details><summary>Check this result yourself</summary>
          <p class="small">${esc(rule)}. The same answers go into the published rules, and anyone can run them.</p>
          ${published ? `<p class="small">Published on X Layer as circuit <b>#${published.circuitId}</b> on processor <code>${CFG.processor}</code>. Anyone can run this command:</p><pre>cast call ${CFG.processor} "eval(uint256,bytes)(bytes)" ${published.circuitId} 0x${hexIn} --rpc-url ${CFG.rpc}</pre><p class="small">The first byte of the answer is the result number (${r.result} = ${esc(P.results[r.result])}).</p>`
            : `<p class="small">This checker has not been published on X Layer yet, so the result above is computed in your browser from the same rules. Once published, the page asks the TapeOut processor and shows a confirmation.</p>`}
          <p class="small">Circuit: ${C.gates.length} NAND gates, ${nQ} inputs, ${C.nOut} outputs.</p><pre>${C.hex}</pre></details></div>`;
      $("#cp").onclick = e => copy(link, e.target); $("#rs").onclick = () => { ans = Array(nQ).fill(null); history.replaceState(null, "", pre.replace(/[/&]$/, "")); paint(); window.scrollTo({top: 0, behavior: "smooth"}); };
      history.replaceState(null, "", pre + "a=" + m);
      const vb = $("#vbadge");
      if (!published) { vb.className = "badge warn"; vb.textContent = "Preview: computed in your browser"; return; }
      evalOnChain(published.circuitId, m, nQ, C.nOut).then(got => { if (mine !== seq) return; if (got === r.result) { vb.className = "badge ok"; vb.textContent = "✓ Confirmed by the TapeOut processor on X Layer"; } else { vb.className = "badge warn"; vb.textContent = "The chain gave a different result. Do not rely on this page."; } })
        .catch(() => { if (mine !== seq) return; vb.className = "badge warn"; vb.textContent = "Could not reach X Layer; showing the browser result"; });
    }
    paint(); report();
    const c1 = $("#cps1"); if (c1) { c1.onclick = e => copy($("#snip1").textContent, e.target); $("#cps2").onclick = e => copy($("#snip2").textContent, e.target); }
  }

  function verify() {
    main.innerHTML = `<h1>Verify a published circuit</h1><p class="lede">Look up any circuit on the TapeOut processor and run it yourself. This asks X Layer directly, so you do not have to trust this page.</p>
      <div class="card"><div class="row"><label>Circuit number <input id="cid" type="number" min="1" style="width:120px"></label><label>Answers, one digit per question, question 1 first <input id="bits" type="text" placeholder="1111111" style="width:220px" autocomplete="off"></label><button class="btn" id="go" type="button">Run it</button></div><div id="vout"></div></div>
      <p class="small mute">Processor: <code>${CFG.processor}</code></p>`;
    $("#go").onclick = async () => {
      const id = Number($("#cid").value), bits = $("#bits").value.trim(), out = $("#vout"); if (!id || !/^[01]+$/.test(bits)) { out.innerHTML = `<p class="err">Enter a circuit number and answers made of 0 and 1.</p>`; return; }
      out.innerHTML = `<p class="mute">Asking X Layer…</p>`;
      try {
        const info = await circuitInfo(id), owner = await circuitOwner(id);
        if (bits.length !== info.nIn) { out.innerHTML = `<p class="err">Circuit #${id} has ${info.nIn} inputs, but you gave ${bits.length} answers.</p>`; return; }
        const m = [...bits].reduce((acc, ch, k) => acc + (ch === "1" ? 2 ** k : 0), 0), res = await evalOnChain(id, m, info.nIn, info.nOut);
        out.innerHTML = `<p><b>Result number: ${res}</b> (circuit #${id} has ${info.nIn} inputs and ${info.nOut} outputs; owner <code>${owner}</code>)</p><p class="small">Open the checker that matches this circuit to see what result number ${res} means.</p>`;
      } catch (e) { out.innerHTML = `<p class="err">Could not read that circuit: ${esc(e.message)}</p>`; }
    };
  }

  function about() {
    main.innerHTML = `<h1>How it works</h1>
    <div class="card"><h3>In plain words</h3><ol><li>A business writes its policy as simple rules: yes/no questions and a list of results.</li><li>The rules become a small circuit stored on X Layer through TapeOut. Once stored it can't be changed, so the business can't quietly change the rules after a claim.</li><li>A customer answers the questions and sees the result and the reason.</li><li>If the customer and the business answer a question differently, only that question goes to a neutral reviewer.</li><li>Anyone can run the same answers through the same circuit and get the same result, for free.</li></ol></div>
    <h2>What it does not do</h2>
    <div class="note">It does not check that the answers are true. If someone gives a false answer, the result will follow the false answer. The reviewer decides disputed facts, and a reviewer can be wrong. The circuit shows the rules were applied consistently, nothing more.</div>
    <div class="note">A person is not a wallet. Where an operator submits answers for someone without a wallet, that is recorded, and you are trusting the operator to pass them on unchanged.</div>
    <h2>Status</h2><p>Prototype built for the X Layer TapeOut Accelerate hackathon. The contracts are unaudited and hold no funds. This page currently computes checkers in your browser and confirms against the chain once a checker has been published.</p>`;
  }

  // ---------- router ----------
  function route() {
    const h = location.hash.replace(/^#/, ""), [view, key, ...rest] = h.split("/");
    document.body.classList.toggle("embed", view === "embed");
    document.querySelectorAll("#nav a").forEach(a => a.classList.toggle("on", a.dataset.k === view));
    window.scrollTo(0, 0);
    if (!view) return home();
    if (view === "check") return check(key || "warranty", rest.join("/"));
    if (view === "embed") return check(key || "warranty", rest.join("/"), true);
    if (view === "case") return key ? window.TB_CASES.view(key) : window.TB_CASES.list();
    if (view === "build") return window.TB_BUILD.build();
    if (view === "verify") return verify();
    if (view === "about") return about();
    home();
  }
  window.addEventListener("hashchange", route);
  route();
})();

</script>
</body></html>
