<!doctype html>
<html lang="en"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Tiebreak: check a decision before it is made</title>
<meta name="description" content="Publish your policy as a checker anyone can trust. Customers see the result and the reason, and anyone can re-run it.">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%230f766e'/%3E%3Cpath d='M8 17l5 5 11-12' fill='none' stroke='white' stroke-width='3.4' stroke-linecap='round' stroke-linejoin='round'/%3E%3C/svg%3E">
<style>
:root{--bg:#f7f7f4;--card:#fff;--ink:#16211f;--mute:#5d6b68;--line:#dfe4e1;--acc:#0f766e;--acc2:#e6f4f1;--warn:#b45309;--warn2:#fdf1e1;--bad:#b42318;--code:#f0f2f0}
@media(prefers-color-scheme:dark){:root{--bg:#101615;--card:#18201f;--ink:#e8efed;--mute:#9db0ac;--line:#2a3735;--acc:#37b3a5;--acc2:#16302d;--warn:#f0b35f;--warn2:#2e2415;--bad:#ff8a80;--code:#0c1211}}
*{box-sizing:border-box}html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.55 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
a{color:var(--acc)}
header{border-bottom:1px solid var(--line);background:var(--card)}
.bar{max-width:880px;margin:0 auto;padding:12px 16px;display:flex;gap:6px 18px;align-items:center;flex-wrap:wrap}
.brand{font-weight:700;font-size:19px;color:var(--ink);text-decoration:none;display:flex;gap:8px;align-items:center}
.brand i{width:22px;height:22px;border-radius:6px;background:var(--acc);display:inline-block}
nav{display:flex;gap:4px 14px;flex-wrap:wrap}nav a{color:var(--mute);text-decoration:none;padding:4px 0;border-bottom:2px solid transparent}
nav a.on{color:var(--ink);border-color:var(--acc)}
main{max-width:880px;margin:0 auto;padding:22px 16px 60px}
h1{font-size:clamp(26px,5vw,38px);line-height:1.15;margin:.2em 0 .35em;letter-spacing:-.01em}
h2{font-size:21px;margin:1.4em 0 .4em}h3{font-size:17px;margin:1em 0 .3em}
.lede{font-size:18px;color:var(--mute);max-width:640px}
.grid{display:grid;gap:14px;grid-template-columns:repeat(auto-fit,minmax(250px,1fr));margin:18px 0}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px 18px}
.card h3{margin-top:0}
.btn{display:inline-block;font:inherit;font-weight:600;border:1px solid var(--acc);background:var(--acc);color:#fff;border-radius:10px;padding:9px 16px;cursor:pointer;text-decoration:none}
.btn.ghost{background:transparent;color:var(--acc)}.btn.small{padding:5px 11px;font-size:14px}
.btn:focus-visible,button:focus-visible,textarea:focus-visible,input:focus-visible{outline:3px solid var(--acc);outline-offset:2px}
.q{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px 14px;margin:10px 0}
.q .t{font-weight:600}.q .h{font-size:14px;color:var(--mute);margin:2px 0 8px}
.yn{display:flex;gap:8px}.yn button{flex:1;max-width:120px;font:inherit;border:1px solid var(--line);background:transparent;color:var(--ink);border-radius:9px;padding:8px;cursor:pointer}
.yn button[aria-pressed=true]{background:var(--acc);border-color:var(--acc);color:#fff;font-weight:600}
.prog{height:6px;background:var(--line);border-radius:4px;overflow:hidden;margin:8px 0 2px}.prog i{display:block;height:100%;background:var(--acc);transition:width .2s}
.res{border:2px solid var(--acc);background:var(--acc2);border-radius:14px;padding:16px 18px;margin:18px 0;position:sticky;bottom:10px}
.res .big{font-size:24px;font-weight:700;line-height:1.2}.res .why{margin:.3em 0 .6em}
.badge{display:inline-block;font-size:13px;border-radius:999px;padding:2px 10px;background:var(--card);border:1px solid var(--line);color:var(--mute)}
.badge.ok{color:var(--acc);border-color:var(--acc)}.badge.warn{color:var(--warn);border-color:var(--warn);background:var(--warn2)}
details{margin:.6em 0}summary{cursor:pointer;font-weight:600}
pre,code,textarea.mono{font:13px/1.45 ui-monospace,SFMono-Regular,Menlo,monospace}
pre{background:var(--code);border:1px solid var(--line);border-radius:10px;padding:10px 12px;overflow:auto;white-space:pre-wrap;word-break:break-all;margin:.4em 0}
textarea{width:100%;font:inherit;background:var(--card);color:var(--ink);border:1px solid var(--line);border-radius:10px;padding:10px}
textarea.mono{min-height:340px;resize:vertical}
input[type=text],input[type=number]{font:inherit;background:var(--card);color:var(--ink);border:1px solid var(--line);border-radius:9px;padding:8px 10px;max-width:100%}
.row{display:flex;gap:8px 12px;flex-wrap:wrap;align-items:center;margin:8px 0}
.err{color:var(--bad);margin:.2em 0}.ok{color:var(--acc)}.mute{color:var(--mute)}.small{font-size:14px}
.note{border-left:4px solid var(--warn);background:var(--warn2);padding:8px 12px;border-radius:0 10px 10px 0;margin:12px 0;font-size:15px}
.stats{display:flex;gap:10px;flex-wrap:wrap;margin:8px 0}.stats span{background:var(--card);border:1px solid var(--line);border-radius:9px;padding:4px 10px;font-size:14px}
#editor input[type=text]{min-width:0}
select{font:inherit;color:var(--ink);background:var(--card);border:1px solid var(--line);border-radius:8px;padding:6px 8px;max-width:100%;min-width:0}
code{overflow-wrap:anywhere}
.qrow{display:grid;grid-template-columns:auto minmax(0,2fr) minmax(0,1fr) auto;gap:8px;align-items:center;margin:8px 0}
.qrow input{width:100%}.qrow .acts{display:flex;gap:4px}
.wide input{width:100%}.wide{display:grid;grid-template-columns:minmax(0,max-content) minmax(0,1fr);gap:8px;align-items:center;margin:8px 0}.wide label{display:contents}
@media(max-width:640px){.wide{grid-template-columns:minmax(0,1fr)}.qrow{grid-template-columns:auto minmax(0,1fr)}.qrow input:nth-of-type(2){grid-column:2}.qrow .acts{grid-column:2}}
table th,table td{padding:5px 10px 5px 0;vertical-align:top}table th{white-space:nowrap}
footer{max-width:880px;margin:0 auto;padding:0 16px 40px;color:var(--mute);font-size:14px}
[hidden]{display:none!important}
</style></head>
<body>
<header><div class="bar"><a class="brand" href="#"><i></i>Tiebreak</a>
<nav id="nav"><a href="#check/warranty" data-k="check">Check a claim</a><a href="#case" data-k="case">Settle a dispute</a><a href="#build" data-k="build">For businesses</a><a href="#verify" data-k="verify">Verify a circuit</a><a href="#about" data-k="about">How it works</a></nav></div></header>
<main id="main"></main>
<footer>Tiebreak is a hackathon prototype for X Layer. Contracts are unaudited and hold no funds. Results show how a published policy applies to the answers given; they do not prove the answers are true.</footer>
<script src="rules.js"></script><script src="config.js"></script><script src="builder.js"></script><script src="cases.js"></script><script src="app.js"></script>
</body></html>
